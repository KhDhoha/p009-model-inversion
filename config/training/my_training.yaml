
seed: 42

model:
  architecture: resnet50
  num_classes: 9  # Adjust based on your dataset (e.g., 9 classes in my_dataset)
  pretrained: true

dataset:
  type: custom  # Use 'custom' for your own dataset
  path: data/my_dataset  # Path to your dataset folder
  training_set_size: 2000  # Optional: limit training samples
  validation_set_size: 500  # Optional: validation samples
  image_size: 224

transformations:
  RandomResizedCrop:
    size: [224, 224]
    scale: [0.8, 1.0]
  RandomHorizontalFlip:
    p: 0.5
  ColorJitter:
    brightness: 0.1
    contrast: 0.1

optimizer:
  Adam:
    lr: 0.001
    weight_decay: 0.0001

lr_scheduler:
  StepLR:
    step_size: 50
    gamma: 0.1

training:
  num_epochs: 100
  batch_size: 32
  label_smoothing: 0.0
  dataloader_num_workers: 0  # Set to 0 to avoid pickling issues with custom dataset
  save_path: results/

rtpt:
  name_initials: HP  # Your initials for RTPT progress tracking
  experiment_name: Training custom model

wandb:
  enable_logging: true
  args:
    project: model_training
    name: resnet50_custom_dataset
    save_code: true
