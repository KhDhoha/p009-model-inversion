seed: 42

model:
  architecture: resnet50
  num_classes: 9
  pretrained: true
  defended: true

dataset:
  type: custom
  path: data/my_dataset
  training_set_size: 2000
  validation_set_size: 500
  image_size: 224

transformations:
  RandomResizedCrop:
    size: [224, 224]
    scale: [0.8, 1.0]

  RandomHorizontalFlip:
    p: 0.5

  ColorJitter:
    brightness: 0.1
    contrast: 0.1

optimizer:
  Adam:
    lr: 0.001
    weight_decay: 0.0001

lr_scheduler:
  StepLR:
    step_size: 50
    gamma: 0.1

training:
  num_epochs: 100
  batch_size: 32
  label_smoothing: 0.0
  dataloader_num_workers: 0
  save_path: trained_model/trained_model_defense

rtpt:
  name_initials: HP
  experiment_name: Defended Training

wandb:
  enable_logging: true
  args:
    project: model_training
    name: defended_resnet50
    save_code: true